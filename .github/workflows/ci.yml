name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      uses: lukka/get-cmake@latest
      with:
        cmake-version: '3.25.0'

    - name: Configure CMake Target
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/3DAndEngine*
          build/**/unit_tests*

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        uses: lukka/get-cmake@latest
        with:
          cmake-version: '3.25.0'

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: pwsh
        run: |
          # 1. Создаем чистую структуру папок дистрибутива SDK
          New-Item -ItemType Directory -Force -Path "dist/bin"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          New-Item -ItemType Directory -Force -Path "dist/lib"
          
          # 2. ТОТАЛЬНЫЙ ПОИСК БИНАРНИКОВ ПО ВСЕМУ КАТАЛОГУ (РЕНТГЕН):
          # Сканируем весь рабочий каталог проекта, игнорируя папку dist, чтобы избежать зацикливания.
          
          # Ищем исполняемый файл движка по имени (найдет и 3DAndEngine.exe на Windows, и 3DAndEngine на Linux/Mac)
          Get-ChildItem -Path "." -Recurse -File | Where-Object { $_.FullName -notlike "*dist*" -and $_.BaseName -eq "3DAndEngine" } | Copy-Item -Destination "dist/bin/" -Force
          
          # Ищем саму динамическую библиотеку ядра движка (пропуская файлы импорта .lib)
          Get-ChildItem -Path "." -Recurse -File | Where-Object { $_.FullName -notlike "*dist*" -and $_.Name -like "*engine_core_lib*" -and $_.Extension -ne ".lib" } | Copy-Item -Destination "dist/bin/" -Force
          
          # Забираем сторонние DLL (spdlog, fmt) и Unix-библиотеки (.so, .dylib), которые vcpkg скопировал в папки сборки
          Get-ChildItem -Path "." -Recurse -File | Where-Object { $_.FullName -notlike "*dist*" -and ($_.Name -eq "spdlog.dll" -or $_.Name -eq "fmt.dll" -or $_.Extension -in '.so', '.dylib') } | Copy-Item -Destination "dist/bin/" -Force
          
          # Находим служебные файлы .lib для статической линковки плагинов на Windows и кладем их в папку lib
          Get-ChildItem -Path "." -Recurse -File | Where-Object { $_.FullName -notlike "*dist*" -and $_.Extension -eq ".lib" } | Copy-Item -Destination "dist/lib/" -Force
          
          # 3. Чистим папку bin от случайных артефактов тестирования, если они туда просочились
          Get-ChildItem -Path "dist/bin" -File | Where-Object { $_.Name -like "*unit_tests*" } | Remove-Item -Force
          
          # 4. Копируем заголовочные файлы инфраструктуры для разработки модулей
          if (Test-Path "include/core") {
              Copy-Item -Path "include/core/*" -Destination "dist/include/core/" -Recurse -Force
          }
          
          # 5. Копируем файл настроек
          if (Test-Path "config.json") {
              Copy-Item -Path "config.json" -Destination "dist/bin/" -Force
          }
          
          # 6. Архивируем получившуюся структуру кроссплатформенным архиватором CMake
          Set-Location dist
          cmake -E tar cfv ../release-artifacts-${{ matrix.os }}.zip --format=zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
