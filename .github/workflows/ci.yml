name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Developer Command Prompt for MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake Target
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/bin/Debug/*
          build/**/bin/*
          build/**/3DAndEngine*

    - name: Run embedded core unit tests
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          if [ -f "build/Debug/3DAndEngine.exe" ]; then
            ./build/Debug/3DAndEngine.exe
          elif [ -f "build/bin/Debug/3DAndEngine.exe" ]; then
            ./build/bin/Debug/3DAndEngine.exe
          else
            find build -name "3DAndEngine.exe" -exec {} \;
          fi
        else
          if [ -f "build/3DAndEngine" ]; then
            ./build/3DAndEngine
          elif [ -f "build/bin/3DAndEngine" ]; then
            ./build/bin/3DAndEngine
          else
            find build -name "3DAndEngine" -type f -exec {} \;
          fi
        fi

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: pwsh
        run: |
          # 1. Создаем структуру папок дистрибутива SDK v2.0.0
          New-Item -ItemType Directory -Force -Path "dist/bin"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          
          # 2. Копирование исполняемых файлов ядра
          if (Test-Path "build/Release") {
              Copy-Item -Path "build/Release/3DAndEngine*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          } elseif (Test-Path "build/bin/Release") {
              Copy-Item -Path "build/bin/Release/3DAndEngine*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          } elseif (Test-Path "build/bin") {
              Copy-Item -Path "build/bin/3DAndEngine*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          } else {
              Get-ChildItem -Path "build" -Filter "3DAndEngine*" -Recurse | Where-Object { $_.DirectoryName -notmatch "CMakeFiles" } | Copy-Item -Destination "dist/bin/" -Force
          }
          
          # 3. Чистим мусор компиляции
          Get-ChildItem -Path "dist/bin" -File | Where-Object { 
              $_.Extension -eq '.obj' -or 
              $_.Extension -eq '.o' -or 
              $_.Extension -eq '.ilk' -or 
              $_.Extension -eq '.pdb' -or 
              $_.Extension -eq '.exp' 
          } | Remove-Item -Force -ErrorAction SilentlyContinue
          
          # ==============================================================================
          # 4. ИСПРАВЛЕНО: Жесткий белый список заголовочных файлов ядра v2.0.0
          # Копируем ТОЛЬКО новые AAA-файлы, полностью игнорируя старый мусор v1.0
          # ==============================================================================
          $AllowedHeaders = @(
              "Types.h", 
              "EcsRegistry.h", 
              "EventBus.h", 
              "JobSystem.h", 
              "PluginContract.h", 
              "Application.h", 
              "Platform.h", 
              "PluginLoader.h"
          )

          foreach ($Header in $AllowedHeaders) {
              $SourcePath = "include/core/$Header"
              if (Test-Path $SourcePath) {
                  Copy-Item -Path $SourcePath -Destination "dist/include/core/" -Force
                  Write-Output "[CI SDK Pack] Successfully whitelisted: $Header"
              } else {
                  Write-Warning "[CI SDK Pack WARNING] Expected header not found: $SourcePath"
              }
          }
          
          # 5. Копируем файл настроек, если он существует
          if (Test-Path "config.json") {
              Copy-Item -Path "config.json" -Destination "dist/bin/" -Force
          }
          
          # 6. Архивируем структуру кроссплатформенным архиватором CMake
          Set-Location dist
          cmake -E tar cfv ../release-artifacts-${{ matrix.os }}.zip --format=zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
