name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release] # Тестируем сразу Release конфигурацию, как на ПК!

    steps:
    - uses: actions/checkout@v4

    - name: Set up Developer Command Prompt for MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake Target
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: pwsh
        run: |
          # 1. Создаем структуру папок дистрибутива SDK v0.2.0 (Чистый интерфейсный стандарт)
          New-Item -ItemType Directory -Force -Path "dist/bin"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          
          # 2. КОПИРОВАНИЕ ИСПОЛНЯЕМЫХ ФАЙЛОВ ИЗ ПАПКИ ВЫВОДА:
          if (Test-Path "build/bin/Release") {
              Copy-Item -Path "build/bin/Release/*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          } elseif (Test-Path "build/bin") {
              Copy-Item -Path "build/bin/*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          }
          
          # 3. Чистим мусор компиляции Windows (.obj, .ilk, .pdb) и Linux/macOS (.o), оставляя только бинарники
          Get-ChildItem -Path "dist/bin" -File | Where-Object { 
              $_.Extension -eq '.obj' -or 
              $_.Extension -eq '.o' -or 
              $_.Extension -eq '.ilk' -or 
              $_.Extension -eq '.pdb' -or 
              $_.Extension -eq '.exp' 
          } | Remove-Item -Force -ErrorAction SilentlyContinue
          
          # 4. Копируем заголовочные файлы-интерфейсы инфраструктуры v0.2.0
          if (Test-Path "include/core") {
              Copy-Item -Path "include/core/*" -Destination "dist/include/core/" -Recurse -Force
          }
          
          # 5. Копируем файл настроек, если он существует в корне
          if (Test-Path "config.json") {
              Copy-Item -Path "config.json" -Destination "dist/bin/" -Force
          }
          
          # 6. Архивируем получившуюся структуру кроссплатформенным архиватором CMake
          Set-Location dist
          cmake -E tar cfv ../release-artifacts-${{ matrix.os }}.zip --format=zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
