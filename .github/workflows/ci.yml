name: CI/CD v0.4.0 Core & SDK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. СБОРКА И ТЕСТИРОВАНИЕ НА ВСЕХ ПЛАТФОРМАХ (Windows, Linux, macOS)
  # ============================================================================
  build_and_test:
    name: Build & Test Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build Core & Tests (${{ matrix.config }})
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run Embedded Engine & Unit Tests Binary
        shell: bash
        env:
          CI: "1"
        run: |
          echo "[CI] Executing standalone tests..."
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Поиск бинарника 3DAndEngine.exe на Windows
            EXE_PATH=""
            for CANDIDATE in "./bin/Release/3DAndEngine.exe" "./bin/3DAndEngine.exe" "./build/bin/Release/3DAndEngine.exe" "./build/bin/3DAndEngine.exe" "./build/Release/3DAndEngine.exe" "./build/3DAndEngine.exe"; do
              if [ -f "$CANDIDATE" ]; then
                EXE_PATH="$CANDIDATE"
                break
              fi
            done
            
            if [ -z "$EXE_PATH" ]; then
              echo "[CI ERROR] Binary 3DAndEngine.exe not found! Listing files:"
              find . -name "*.exe" || true
              exit 1
            fi
            
            echo "[CI] Running Windows binary: $EXE_PATH"
            "$EXE_PATH" --ci
          else
            # Поиск бинарника 3DAndEngine на Linux и macOS
            EXE_PATH=""
            for CANDIDATE in "./bin/3DAndEngine" "./bin/Release/3DAndEngine" "./build/bin/3DAndEngine" "./build/3DAndEngine"; do
              if [ -f "$CANDIDATE" ]; then
                EXE_PATH="$CANDIDATE"
                break
              fi
            done
            
            if [ -z "$EXE_PATH" ]; then
              EXE_PATH=$(find . -type f -name "3DAndEngine" -not -path "*/.*" | head -n 1)
            fi
            
            if [ -z "$EXE_PATH" ] || [ ! -f "$EXE_PATH" ]; then
              echo "[CI ERROR] Binary 3DAndEngine not found! Listing files:"
              find . -type f -perm +111 -o -name "3DAndEngine*" || true
              exit 1
            fi
            
            echo "[CI] Running POSIX binary: $EXE_PATH"
            chmod +x "$EXE_PATH"
            "$EXE_PATH" --ci
          fi

  # ============================================================================
  # 2. СБОРКА И ПУБЛИКАЦИЯ РЕЛИЗНОГО SDK БАНДЛА (v0.4.0 Commercial Package)
  # ============================================================================
  release_build:
    name: Package and Publish SDK v0.4.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build_and_test]
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake for Release
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Artifacts
        run: cmake --build build --config Release --parallel

      - name: Package SDK v0.4.0 Structure
        shell: pwsh
        run: |
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          
          # Создаем дерево каталогов для игрового SDK v0.4.0
          New-Item -ItemType Directory -Force -Path "dist/bin/plugins"
          New-Item -ItemType Directory -Force -Path "dist/bin/shaders"
          New-Item -ItemType Directory -Force -Path "dist/bin/assets"
          New-Item -ItemType Directory -Force -Path "dist/bin/configs"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          New-Item -ItemType Directory -Force -Path "dist/lib"
          
          # 1. Копирование исполняемых файлов
          $BinSearchPaths = @(
            "bin/Release/3DAndEngine*", 
            "bin/3DAndEngine*", 
            "build/bin/Release/3DAndEngine*", 
            "build/Release/3DAndEngine*",
            "build/3DAndEngine*"
          )
          
          foreach ($Path in $BinSearchPaths) {
              if (Test-Path $Path) {
                  Get-ChildItem -Path $Path -File | Where-Object { $_.Extension -in ".exe", "" } | Copy-Item -Destination "dist/bin/" -Force
              }
          }
          
          # Запасной поиск бинарников, если они в нестандартной папке
          if ((Get-ChildItem -Path "dist/bin" -File).Count -eq 0) {
              Write-Warning "[CI] Running deep scan for engine binaries..."
              Get-ChildItem -Path "build/" -Filter "3DAndEngine*" -Recurse | Where-Object { $_.Extension -in ".exe", "" } | Select-Object -First 1 | Copy-Item -Destination "dist/bin/" -Force
          }
          
          # 2. Копирование всех заголовочных файлов ядра из include/core/
          if (Test-Path "include/core") {
              Get-ChildItem -Path "include/core/*" -Include "*.h", "*.hpp" | Copy-Item -Destination "dist/include/core/" -Force
          }
          
          # 3. Копирование документации и исходного кода тестов
          $DocFiles = @("README*", "LICENSE*", "PLUGIN_GUIDE*", "RELEASE_NOTES*")
          foreach ($Doc in $DocFiles) {
              Get-ChildItem -Path $Doc | Copy-Item -Destination "dist/" -Force
          }

          if (Test-Path "src/UnitTestsMain.cpp") {
              Copy-Item "src/UnitTestsMain.cpp" -Destination "dist/" -Force
          }

          # 4. Создание zip-архива SDK
          Set-Location dist
          $OsName = "${{ matrix.os }}".Replace("-latest", "")
          $ZipName = "../3DAndEngine-SDK-v0.4.0-$OsName.zip"
          cmake -E tar cfv $ZipName --format=zip .
          Write-Host "[CI] Successfully generated SDK archive: $ZipName"

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: 3DAndEngine-SDK-v0.4.0-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}