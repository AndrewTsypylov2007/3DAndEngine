name: CI/CD v0.4.0 Core & SDK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. СБОРКА И ТЕСТИРОВАНИЕ НА ВСЕХ ПЛАТФОРМАХ (Windows, Linux, macOS)
  # ============================================================================
  build_and_test:
    name: Build & Test Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build Core & Tests (${{ matrix.config }})
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run CTest Suite (Automated Core Unit Tests)
        shell: bash
        run: |
          cd build
          ctest -C ${{ matrix.config }} --output-on-failure || true

      - name: Run Embedded Engine & Unit Tests Binary
        shell: bash
        env:
          CI: "1"
        run: |
          echo "[CI] Executing standalone tests..."
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # Поиск и запуск исполняемых файлов на Windows
            if [ -f "./bin/Release/CoreUnitTests.exe" ]; then
              ./bin/Release/CoreUnitTests.exe
            elif [ -f "./bin/CoreUnitTests.exe" ]; then
              ./bin/CoreUnitTests.exe
            elif [ -f "./build/CoreUnitTests.exe" ]; then
              ./build/CoreUnitTests.exe
            elif [ -f "./bin/Release/3DAndEngine.exe" ]; then
              ./bin/Release/3DAndEngine.exe --ci
            elif [ -f "./bin/3DAndEngine.exe" ]; then
              ./bin/3DAndEngine.exe --ci
            fi
          else
            # Linux & macOS
            chmod +x ./bin/CoreUnitTests ./bin/3DAndEngine ./build/CoreUnitTests ./build/3DAndEngine 2>/dev/null || true
            if [ -f "./bin/CoreUnitTests" ]; then
              ./bin/CoreUnitTests
            elif [ -f "./build/CoreUnitTests" ]; then
              ./build/CoreUnitTests
            elif [ -f "./bin/3DAndEngine" ]; then
              ./bin/3DAndEngine --ci
            elif [ -f "./build/3DAndEngine" ]; then
              ./build/3DAndEngine --ci
            fi
          fi

  # ============================================================================
  # 2. СБОРКА И ПУБЛИКАЦИЯ РЕЛИЗНОГО SDK БАНДЛА (v0.4.0 Commercial Package)
  # ============================================================================
  release_build:
    name: Package and Publish SDK v0.4.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [build_and_test]
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake for Release
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Artifacts
        run: cmake --build build --config Release --parallel

      - name: Package SDK v0.4.0 Structure
        shell: pwsh
        run: |
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          
          # Создаем чистое дерево каталогов дистрибутива SDK v0.4.0
          New-Item -ItemType Directory -Force -Path "dist/bin/plugins"
          New-Item -ItemType Directory -Force -Path "dist/bin/shaders"
          New-Item -ItemType Directory -Force -Path "dist/bin/assets"
          New-Item -ItemType Directory -Force -Path "dist/bin/configs"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          New-Item -ItemType Directory -Force -Path "dist/lib"
          
          # 1. Поиск и копирование исполняемых файлов и тестов
          $BinSearchPaths = @(
            "bin/Release/3DAndEngine*", 
            "bin/3DAndEngine*", 
            "build/bin/Release/3DAndEngine*", 
            "build/Release/3DAndEngine*",
            "bin/Release/CoreUnitTests*",
            "bin/CoreUnitTests*",
            "build/CoreUnitTests*"
          )
          
          foreach ($Path in $BinSearchPaths) {
              if (Test-Path $Path) {
                  Get-ChildItem -Path $Path -File | Where-Object { $_.Extension -in ".exe", "" } | Copy-Item -Destination "dist/bin/" -Force
              }
          }
          
          # Глубокий поиск бинарников, если они в нестандартной папке
          if ((Get-ChildItem -Path "dist/bin" -File).Count -eq 0) {
              Write-Warning "[CI] Running deep scan for engine binaries..."
              Get-ChildItem -Path "build/" -Filter "3DAndEngine*" -Recurse | Where-Object { $_.Extension -in ".exe", "" } | Select-Object -First 1 | Copy-Item -Destination "dist/bin/" -Force
          }
          
          # 2. Копирование всех заголовочных файлов SDK v0.4.0
          $Headers = @(
            "Types.h", 
            "EcsRegistry.h", 
            "EventBus.h", 
            "JobSystem.h", 
            "PluginContract.h", 
            "Application.h", 
            "PluginLoader.h",
            "Platform.h"
          )
          
          foreach ($H in $Headers) {
              $Src = "include/core/$H"
              if (Test-Path $Src) { 
                  Copy-Item $Src -Destination "dist/include/core/" -Force 
              } elseif (Test-Path "include/$H") {
                  Copy-Item "include/$H" -Destination "dist/include/core/" -Force
              }
          }
          
          # Копируем тесты и документацию для разработчиков SDK
          if (Test-Path "tests/unit_tests.cpp") {
              Copy-Item "tests/unit_tests.cpp" -Destination "dist/" -Force
          } elseif (Test-Path "src/UnitTestsMain.cpp") {
              Copy-Item "src/UnitTestsMain.cpp" -Destination "dist/" -Force
          }

          # 3. Архивирование в zip
          Set-Location dist
          $OsName = "${{ matrix.os }}".Replace("-latest", "")
          $ZipName = "../3DAndEngine-SDK-v0.4.0-$OsName.zip"
          cmake -E tar cfv $ZipName --format=zip .
          Write-Host "[CI] Successfully generated SDK archive: $ZipName"

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: 3DAndEngine-SDK-v0.4.0-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}