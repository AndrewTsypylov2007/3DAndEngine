name: CI/CD Core & Release EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. СБОРКА И ТЕСТИРОВАНИЕ НА ВСЕХ ПЛАТФОРМАХ (Windows, Linux, macOS)
  # ============================================================================
  build_and_test:
    name: Build & Test Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build Core & Tests (${{ matrix.config }})
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run Core Tests (CTest)
        shell: bash
        env:
          CI: "1"
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # ============================================================================
  # 2. ПУБЛИКАЦИЯ РЕЛИЗА: к релизу прикрепляется только 3DAndEngine.exe
  # ============================================================================
  release_build:
    name: Build and Publish Windows EXE
    runs-on: windows-latest
    needs: [build_and_test]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Developer Command Prompt for MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake for Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Executable
        run: cmake --build build --config Release --parallel

      - name: Prepare release asset
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter "3DAndEngine.exe" | Select-Object -First 1
          if (-not $exe) { throw "3DAndEngine.exe not found in build/" }
          $name = "3DAndEngine-${{ github.event.release.tag_name }}-windows-x64.exe"
          Copy-Item $exe.FullName $name
          Write-Host "Release asset: $name"

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 3DAndEngine-*-windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
