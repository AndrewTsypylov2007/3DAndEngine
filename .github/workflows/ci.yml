name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]
  workflow_dispatch: # Позволяет запускать сборку вручную

env:
  # Принудительно переключаем все JS-экшены на актуальный рантайм
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test Core
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Developer Command Prompt for MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests" \
          -DENABLE_LOGGER=ON \
          -DENABLE_SCHEDULER=ON \
          -DENABLE_PLUGIN_DISCOVERY=ON
          
    - name: Build Engine (Release)
      run: cmake --build build --config ${{ matrix.config }}

    - name: Run Embedded Tests
      shell: bash
      run: |
        # Исправлена опечатка matrixos -> matrix.os
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./build/Release/3DAndEngine.exe || ./build/bin/Release/3DAndEngine.exe || ./build/3DAndEngine.exe
        else
          chmod +x ./build/3DAndEngine || true
          ./build/3DAndEngine || ./build/bin/3DAndEngine
        fi

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Release for SDK)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package SDK v2.0 (Strict White-list)
        shell: pwsh
        run: |
          # Очистка старой папки перед упаковкой
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "dist/bin"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          
          # Улучшенный поиск бинарника
          $BinSearchPaths = @("build/Release/3DAndEngine*", "build/bin/Release/3DAndEngine*", "build/3DAndEngine*")
          foreach ($Path in $BinSearchPaths) {
              if (Test-Path $Path) {
                  Get-ChildItem -Path $Path -File | Where-Object { $_.Extension -in ".exe", "" } | Copy-Item -Destination "dist/bin/" -Force
                  break
              }
          }
          
          # Только новые файлы ядра v2.0
          $AllowedHeaders = @("Types.h", "EcsRegistry.h", "EventBus.h", "JobSystem.h", "PluginContract.h", "Application.h", "Platform.h", "PluginLoader.h")
          foreach ($Header in $AllowedHeaders) {
              $Src = "include/core/$Header"
              if (Test-Path $Src) { Copy-Item $Src -Destination "dist/include/core/" -Force }
          }
          
          Set-Location dist
          # Формируем имя архива без лишних дефисов
          $OsName = "${{ matrix.os }}".Replace("-latest", "")
          cmake -E tar cfv ../3DAndEngine-$OsName.zip --format=zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: 3DAndEngine-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
