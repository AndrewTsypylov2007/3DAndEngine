name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      uses: lukka/get-cmake@latest
      with:
        cmake-version: '3.25.0'

    - name: Configure CMake Target
      shell: bash
      run: |
        # Флаг --no-builtin-baseline отключает жесткую валидацию коммитов портов
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/3DAndEngine*
          build/**/unit_tests*

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        uses: lukka/get-cmake@latest
        with:
          cmake-version: '3.25.0'

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: bash
        run: |
          # 1. Создаем чистую структуру папок дистрибутива
          mkdir -p dist/bin
          mkdir -p dist/include/core
          mkdir -p dist/lib
          
          # 2. ПРЯМОЙ КОПИРАЙТ: Ищем бинарники по всей глубине папки build и принудительно копируем в bin/
          find build -type f \( -name "3DAndEngine" -o -name "3DAndEngine.exe" -o -name "*.dll" -o -name "*.so" -o -name "*.dylib" \) -exec cp {} dist/bin/ \; 2>/dev/null || true
          
          # 3. Копируем файлы импорта (.lib) для линковки на Windows
          find build -type f -name "*.lib" -exec cp {} dist/lib/ \; 2>/dev/null || true
          
          # 4. Копируем все заголовочные файлы из include/core/
          cp -r include/core/* dist/include/core/ 2>/dev/null || true
          
          # 5. Копируем файл конфигурации, чтобы движок работал "из коробки"
          if [ -f "config.json" ]; then
            cp config.json dist/bin/ 2>/dev/null || true
          fi
          
          # 6. Упаковываем встроенным архиватором CMake
          cd dist && cmake -E tar cfv ../release-artifacts-${{ matrix.os }}.zip --format=zip .


      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
