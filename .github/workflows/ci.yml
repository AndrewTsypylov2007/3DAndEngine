name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

# Глобальные переменные для совместимости со старыми экшенами в новой среде Node.js
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    # Шаг с lukka/get-cmake удален, так как CMake актуальной версии уже предустановлен на всех раннерах

     Pentesting/Проверка версии CMake перед конфигурацией
    - name: Verify CMake Version
      run: cmake --version

    - name: Configure CMake Target
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/3DAndEngine*
          build/**/unit_tests*
          build/**/*.dll

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: bash
        run: |
          # Создаем изолированную директорию сборки артефактов
          cmake -E make_directory dist
          
          # Устанавливаем скомпилированные бинарники проекта
          cmake --install build --prefix dist
          
          # На Windows принудительно докидываем все внешние DLL из папки сборки в dist/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "Moving Windows Runtime DLLs into release pack..."
            cp build/Release/*.dll dist/bin/ 2>/dev/null || true
          fi
          
          # Копируем config.json, если он есть в корне проекта
          if [ -f "config.json" ]; then
            cp config.json dist/bin/ 2>/dev/null || cp config.json dist/ 2>/dev/null || true
          fi
          
          # Кроссплатформенная архивация через встроенный движок CMake
          cmake -E tar cfv release-artifacts-${{ matrix.os }}.zip --format=zip dist/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
