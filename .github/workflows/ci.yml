name: CI v0.3.0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Test Core v0.3.0
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Developer Command Prompt for MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine (Release)
      run: cmake --build build --config ${{ matrix.config }}

    - name: Run Embedded Tests
      shell: bash
      run: |
        # ИСПРАВЛЕНО: Добавлен путь ./bin/Release/3DAndEngine.exe для Windows-воркера
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          ./bin/Release/3DAndEngine.exe || ./bin/3DAndEngine.exe || ./build/bin/Release/3DAndEngine.exe || ./build/Release/3DAndEngine.exe
        else
          chmod +x ./bin/3DAndEngine || true
          ./bin/3DAndEngine || ./build/bin/3DAndEngine
        fi

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (Release for SDK)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release

      - name: Package SDK v0.3.0 (Commercial Structure)
        shell: pwsh
        run: |
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          # Создаем структуру SDK
          New-Item -ItemType Directory -Force -Path "dist/bin/plugins"
          New-Item -ItemType Directory -Force -Path "dist/bin/shaders"
          New-Item -ItemType Directory -Force -Path "dist/bin/assets"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          
          # 1. ИСПРАВЛЕНО: Кроссплатформенный поиск бинарника теперь проверяет папку bin/Release/
          $BinSearchPaths = @("bin/Release/3DAndEngine*", "bin/3DAndEngine*", "build/bin/Release/3DAndEngine*", "build/Release/3DAndEngine*")
          $Copied = $false
          foreach ($Path in $BinSearchPaths) {
              if (Test-Path $Path) {
                  Get-ChildItem -Path $Path -File | Where-Object { $_.Extension -in ".exe", "" } | Copy-Item -Destination "dist/bin/" -Force
                  $Copied = $true
                  break
              }
          }
          
          if (-not $Copied) {
              Write-Warning "[CI] Исполняемый файл не найден в стандартных директориях. Запуск глубокого поиска..."
              Get-ChildItem -Path "build/" -Filter "3DAndEngine*" -Recurse | Where-Object { $_.Extension -in ".exe", "" } | Select-Object -First 1 | Copy-Item -Destination "dist/bin/" -Force
          }
          
          # 2. Копируем обновленные заголовки v0.3.0
          $Headers = @(
            "Types.h", 
            "EcsRegistry.h", 
            "EventBus.h", 
            "JobSystem.h", 
            "PluginContract.h", 
            "RenderDefinitions.h", 
            "Application.h", 
            "LibraryLoader.h", 
            "PluginLoader.h"
          )
          foreach ($H in $Headers) {
              $Src = "include/core/$H"
              if (Test-Path $Src) { Copy-Item $Src -Destination "dist/include/core/" -Force }
          }
          
          # Упаковка
          Set-Location dist
          $OsName = "${{ matrix.os }}".Replace("-latest", "")
          cmake -E tar cfv ../3DAndEngine-SDK-v0.3.0-$OsName.zip --format=zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: 3DAndEngine-SDK-v0.3.0-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
