name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      uses: lukka/get-cmake@latest
      with:
        cmake-version: '3.25.0'

    - name: Configure CMake Target
      shell: bash
      run: |
        # Флаг --no-builtin-baseline отключает жесткую валидацию коммитов портов
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/3DAndEngine*
          build/**/unit_tests*

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        uses: lukka/get-cmake@latest
        with:
          cmake-version: '3.25.0'

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: bash
        run: |
          # 1. Создаем структуру папок дистрибутива SDK
          mkdir -p dist/bin
          mkdir -p dist/include/core
          mkdir -p dist/lib
          
          # 2. ЖЕЛЕЗОБЕТОННО: Копируем бинарники напрямую из папок сборки Visual Studio
          if [ -d "build/Release" ]; then
            # На Windows всё лежит в build/Release
            cp build/Release/*.exe dist/bin/ 2>/dev/null || true
            cp build/Release/*.dll dist/bin/ 2>/dev/null || true
            cp build/Release/*.lib dist/lib/ 2>/dev/null || true
          else
            # На Linux/Mac всё лежит прямо в корне папки build
            cp build/3DAndEngine dist/bin/ 2>/dev/null || true
            cp build/libengine_core_lib* dist/bin/ 2>/dev/null || true
            cp build/*.so dist/bin/ 2>/dev/null || cp build/*.dylib dist/bin/ 2>/dev/null || true
          fi
          
          # 3. Копируем заголовочные файлы инфраструктуры для разработчиков плагинов
          cp -r include/core/* dist/include/core/ 2>/dev/null || true
          
          # 4. Копируем файл конфигурации
          if [ -f "config.json" ]; then
            cp config.json dist/bin/ 2>/dev/null || true
          fi
          
          # 5. Упаковываем всю структуру встроенным архиватором CMake
          cd dist && cmake -E tar cfv ../release-artifacts-${{ matrix.os }}.zip --format=zip .




      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
