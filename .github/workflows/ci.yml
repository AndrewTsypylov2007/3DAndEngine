name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    # Экшены настройки CMake удалены. Используем нативный CMake из системы.

    - name: Set up Developer Command Prompt for MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake Target
      shell: bash
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
          -DBUILD_TESTS=ON \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_FEATURE_FLAGS="manifests"
          
    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/bin/Debug/*
          build/**/bin/*
          build/**/3DAndEngine*
          build/**/unit_tests*

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Экшены настройки CMake удалены. Используем нативный CMake из системы.

      - name: Set up Developer Command Prompt for MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release)
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_FEATURE_FLAGS="manifests"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: pwsh
        run: |
          # 1. Создаем структуру папок дистрибутива SDK
          New-Item -ItemType Directory -Force -Path "dist/bin"
          New-Item -ItemType Directory -Force -Path "dist/include/core"
          New-Item -ItemType Directory -Force -Path "dist/lib"
          
          # 2. КОПИРОВАНИЕ ИЗ ЕДИНОЙ ПАПКИ ВЫВОДА:
          if (Test-Path "build/bin/Release") {
              Copy-Item -Path "build/bin/Release/*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          } elseif (Test-Path "build/bin") {
              Copy-Item -Path "build/bin/*" -Destination "dist/bin/" -Force -ErrorAction SilentlyContinue
          }
          
          # Копируем .lib файлы импорта из папки lib
          if (Test-Path "build/lib/Release") {
              Copy-Item -Path "build/lib/Release/*.lib" -Destination "dist/lib/" -Force -ErrorAction SilentlyContinue
          } elseif (Test-Path "build/lib") {
              Copy-Item -Path "build/lib/*.lib" -Destination "dist/lib/" -Force -ErrorAction SilentlyContinue
          }
          
          # 3. Чистим мусор компиляции, оставляя только чистые исполняемые файлы и DLL
          Get-ChildItem -Path "dist/bin" -File | Where-Object { $_.Extension -in '.obj', '.ilk', '.pdb', '.exp' } | Remove-Item -Force
          
          # 4. Копируем заголовочные файлы инфраструктуры для разработки модулей
          if (Test-Path "include/core") {
              Copy-Item -Path "include/core/*" -Destination "dist/include/core/" -Recurse -Force
          }
          
          # 5. Копируем файл настроек
          if (Test-Path "config.json") {
              Copy-Item -Path "config.json" -Destination "dist/bin/" -Force
          }
          
          # 6. Архивируем получившуюся структуру кроссплатформенным архиватором CMake
          Set-Location dist
          cmake -E tar cfv ../release-artifacts-${{ matrix.os }}.zip --format=zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
