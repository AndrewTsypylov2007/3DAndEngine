name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake & Ninja
      uses: lukka/get-cmake@latest
      with:
        cmake-version: '3.25.0'

    # Проверенный экшен маркетплейса: разворачивает vcpkg без багов Git-авторизации
    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgGitCommitId: 224976722d32fb1cf6edaf6688e170fc784fa721 # <-- ДОБАВЛЕНО ТУТ


    - name: Configure CMake Target
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Engine
      run: cmake --build build --config ${{ matrix.config }}

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build/**/3DAndEngine*
          build/**/unit_tests*

    - name: Run unit tests
      run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

  release_build:
    name: Build and upload release artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmake-version: '3.25.0'

      # Разворачиваем vcpkg для релиза
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
         vcpkgDirectory: ${{ github.workspace }}/vcpkg
         vcpkgGitCommitId: 224976722d32fb1cf6edaf6688e170fc784fa721 # <-- ДОБАВЛЕНО ТУТ


      - name: Configure (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cmake --install build --prefix dist
          if [ -f "config.json" ]; then
            cp config.json dist/bin/ 2>/dev/null || cp config.json dist/ 2>/dev/null || true
          fi
          cd dist && zip -r ../release-artifacts-${{ matrix.os }}.zip .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts-${{ matrix.os }}.zip
